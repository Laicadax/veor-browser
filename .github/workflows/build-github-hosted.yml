# VEOR Browser — GitHub-Hosted CI/CD Build
# WARNING: GitHub-hosted runners have limits:
#   - 6 hours per job (may timeout on full Chromium build)
#   - ~50GB disk space (Chromium source alone is ~20GB)
#   - 2000 minutes/month for free accounts
#
# This workflow is experimental. Self-hosted runner is strongly recommended.

name: Build VEOR (GitHub-Hosted)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 22.04 has better Chromium compatibility
    timeout-minutes: 360   # 6 hours — GitHub's hard limit

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout VEOR
        uses: actions/checkout@v4
        with:
          path: veor-checkout

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip python3-venv \
            build-essential clang lld ninja-build cmake pkg-config \
            libnss3-dev libdbus-1-dev libatk1.0-dev \
            libgtk-3-dev libgdk-pixbuf2.0-dev libpango1.0-dev \
            libcairo2-dev libx11-dev libxcomposite-dev \
            libxdamage-dev libxext-dev libxfixes-dev \
            libxrandr-dev libxtst-dev libxss-dev \
            libpciaccess-dev libxt-dev libgconf-2-4 \
            libasound2-dev libpulse-dev libdrm-dev \
            libgbm-dev libcurl4-openssl-dev libelf-dev \
            libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libva-dev libvdpau-dev libwebp-dev libjpeg-dev \
            libpng-dev libtiff-dev libxml2-dev libxslt1-dev \
            libsqlite3-dev libffi-dev liblzma-dev libbz2-dev \
            zlib1g-dev libncurses5-dev libreadline-dev \
            libedit-dev libexpat1-dev uuid-dev \
            libjsoncpp-dev libre2-dev libminizip-dev \
            libhunspell-dev libopenjp2-7-dev libopus-dev \
            libsnappy-dev libusb-1.0-0-dev

      - name: Setup Swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Depot Tools
        run: |
          cd ~
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"

      - name: Cache Chromium Source
        uses: actions/cache@v4
        id: chromium-cache
        with:
          path: ~/chromium
          key: chromium-source-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            chromium-source-${{ runner.os }}-

      - name: Fetch Chromium (if not cached)
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          mkdir -p ~/chromium
          cd ~/chromium
          fetch --nohooks chromium

      - name: Sync and Setup Chromium
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd ~/chromium/src
          gclient sync -D
          ./build/install-build-deps.sh --no-prompt || true
          ./build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
          gclient runhooks

      - name: Copy VEOR into Chromium
        run: |
          rm -rf ~/chromium/src/veor
          cp -r $GITHUB_WORKSPACE/veor-checkout ~/chromium/src/veor

      - name: Configure GN
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd ~/chromium/src
          mkdir -p out/veor
          cat > out/veor/args.gn << 'EOF'
          is_debug = false
          is_component_build = false
          symbol_level = 1
          enable_nacl = false
          treat_warnings_as_errors = false
          use_safe_libcxx = true
          use_mold = false
          EOF
          gn gen out/veor

      - name: Build VEOR
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd ~/chromium/src
          ninja -C out/veor veor_browser

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veor-browser-linux-amd64-github
          path: ~/chromium/src/out/veor/veor_browser
          retention-days: 7
